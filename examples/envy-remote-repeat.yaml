# Requires Button Card installed through HACS.
# Arrows repeat KeyPress while held; other buttons send one native KeyHold.
# Paste this into a Home Assistant dashboard manual card.
# Replace remote.envy if Home Assistant assigned a different entity ID.
type: grid
columns: 3
square: false
cards:
  - type: button
    name: Power
    icon: mdi:power
    tap_action:
      action: perform-action
      perform_action: remote.send_command
      target: {entity_id: remote.envy}
      data: {command: "KeyPress, POWER"}
    hold_action:
      action: perform-action
      perform_action: remote.send_command
      target: {entity_id: remote.envy}
      data: {command: "KeyHold, POWER"}
  - type: custom:button-card
    name: Up
    aspect_ratio: 1/1
    icon: mdi:arrow-up
    tap_action:
      action: perform-action
      perform_action: remote.send_command
      target: {entity_id: remote.envy}
      data: {command: "KeyPress, UP"}
    hold_action:
      action: perform-action
      perform_action: remote.send_command
      target: {entity_id: remote.envy}
      data: {command: "KeyPress, UP"}
      repeat: 300
